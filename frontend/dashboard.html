<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PMS Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    input, button { padding: 0.5rem; margin: 0.5rem 0; }
    button { cursor: pointer; }
    .section { margin-top: 2rem; }
    pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>
  <h1>PMS Dashboard</h1>

  <!-- Login Section -->
  <div class="section">
    <h2>Login</h2>
    <form id="loginForm">
      <label>Email:</label><br>
      <input type="email" id="email" value="admin@example.com" required /><br>
      <label>Password:</label><br>
      <input type="password" id="password" value="password123" required /><br>
      <button type="submit">Login</button>
    </form>
    <p><strong>Token:</strong></p>
    <pre id="tokenBox"></pre>
  </div>

  <!-- Actions -->
  <div class="section" id="actions" style="display:none;">
    <h2>Actions</h2>
    <button onclick="fetchData('employees')">Get Employees</button>
    <button onclick="fetchData('tasks')">Get Tasks</button>
    <button onclick="fetchData('evaluations')">Get Evaluations</button>
    <button onclick="fetchData('teams')">Get Teams</button>
    <h3>Response</h3>
    <pre id="responseBox"></pre>
  </div>

  <script>
    let token = "";

    // Login Form
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("http://localhost:5000/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.token) {
          token = data.token;
          document.getElementById("tokenBox").textContent = token;
          document.getElementById("actions").style.display = "block";
        } else {
          document.getElementById("tokenBox").textContent = "Login failed: " + JSON.stringify(data);
        }
      } catch (err) {
        document.getElementById("tokenBox").textContent = "Error: " + err.message;
      }
    });

    // Fetch Employees/Tasks/Evaluations/Teams
    async function fetchData(type) {
      try {
        const res = await fetch(`http://localhost:5000/api/${type}`, {
          headers: { "Authorization": "Bearer " + token }
        });
        const data = await res.json();
        document.getElementById("responseBox").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("responseBox").textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
